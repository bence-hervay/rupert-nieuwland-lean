* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); }
body { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
button, input { font: inherit; color: inherit; }

header { position: relative; display: flex; align-items: baseline; gap: 18px; padding: 12px 18px 10px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }

.ghost:hover { border-color: var(--ink-3); }
#spin { background: #000000; }

main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.pane { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.pane + .pane { border-left: 1px solid var(--rule); }
#gl { display: block; width: 100%; height: 100%; touch-action: none; }

.corner { position: absolute; font-size: 12px; }
.tl { left: 14px; top: 12px; } .bl { left: 14px; bottom: 12px; }
.caption { color: var(--ink-2); pointer-events: none; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bl.tools { display: flex; gap: 8px; }

footer { display: flex; align-items: center; gap: 28px; padding: 12px 18px 14px; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.ctl { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 10px; row-gap: 2px; }

.ctl .end { font-family: var(--mono); color: var(--ink-3); font-size: 12px; }
.ctl output { font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 12ch; flex: none; text-align: right; white-space: nowrap; }
.ctl.scale { flex: 2 1 360px; }

.tr { right: 14px; top: 12px; }

  .posenums > div { grid-template-columns: 2em auto; column-gap: 0; }
  .posenums h2, .posenums table { font-size: 11px; }
  .posenums .col { display: none; } .posenums .row { display: grid; }
  .alg { padding: 10px 14px calc(20px + env(safe-area-inset-bottom)); }

// ---------- tumble.js: a smooth random tumble (the atlas's tiles and a Nopert's page; put before their scripts) ----------
// The solid turns about an axis that wanders over the whole sphere. Its angular velocity is
// ω(τ) = SPEED·v(τ)/√(|v(τ)|² + 1/4), each component of v a sum of two sines of random period (50/3 to 140/3 s) and phase:

// about 0.53 rad/s, a turn in 12 s).
// tumbler(seed, q0, gap).at(τ, frame) is the orientation at time τ in s (an earlier τ than asked before: that one, the
// pose kept), starting from q0 at τ = 0: whole steps of STEP on a fixed grid, the same whatever the frame rate. ω is
// taken in `frame` (the view's quaternion; none: the world's), so the solid tumbles alike from wherever it is seen. A
// gap of over `gap` s (default GAP: a tile off the screen) is skipped, not stepped through. test_tumble.mjs tests it.

    if (za < zNear) { a = toNear(a, b, za, zb); za = zNear; } else if (zb < zNear) { b = toNear(b, a, zb, za); zb = zNear; }
    const sx = q => dot([q[0] - eye[0], q[1] - eye[1], q[2] - eye[2]], R), sy = q => dot([q[0] - eye[0], q[1] - eye[1], q[2] - eye[2]], U);
    const dx = sx(b) / zb - sx(a) / za, dy = sy(b) / zb - sy(a) / za, L = Math.hypot(dx, dy);
    if (!L) continue;
    run(1);
    const hd = it.w * pr / 2, E = hd + 1, n = [0, 1, 2].map(i => (-dy * R[i] + dx * U[i]) / L);
    const oa = n.map(x => x * E * k * za), ob = n.map(x => x * E * k * zb);
    const A1 = a.map((x, i) => x + oa[i]), A2 = a.map((x, i) => x - oa[i]), B1 = b.map((x, i) => x + ob[i]), B2 = b.map((x, i) => x - ob[i]);
    for (const [q, s] of [[A1, E], [A2, -E], [B2, -E], [A1, E], [B2, -E], [B1, E]]) put(q, UP, it.c, s, hd);
  }
  run(-1);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 4));
  g.setAttribute('across', new THREE.Float32BufferAttribute(acr, 2));
  mesh.geometry.dispose(); mesh.geometry = g;
  const at = camera.position.clone();
  camera.position.set(0, 0, 0); camera.updateMatrixWorld(true);
  renderer.render(scene, camera);
  camera.position.copy(at); camera.updateMatrixWorld(true);
}
// framed so that it fits whichever way it turns: the sphere about its centre through its farthest vertex, seen with
// margins of at least 5%
let homeDist = 4 * r0;
function fitFrustum() {
  const p = canvas.parentElement, a = p.clientWidth / Math.max(1, p.clientHeight), tv = Math.tan(THREE.MathUtils.degToRad(FOV) / 2), th = tv * a;
  camera.aspect = a; camera.updateProjectionMatrix();
  const c = 0.9 * Math.min(tv, th);
  homeDist = r0 * Math.sqrt(1 + 1 / (c * c));
}

// ---------- the animation: the solid's tumble (tumble.js) on explorer.js's eased clock, before a still view ----------
const RAMP = 0.8, AZ0 = Math.atan2(-0.56, 0.74), ELEV = 0.39;
const hs = new URLSearchParams(location.hash.slice(1));
const AT = +(hs.get('at') || 0);
const clock = () => performance.now() / 1000 + AT;
const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * u * (u * (6 * u - 15) + 10);
const EI = x => x * x * x * x * (x * (x - 3) + 2.5);
const m4 = new THREE.Matrix4(), ORIGIN = new THREE.Vector3(), ZUP = new THREE.Vector3(0, 0, 1);
const orient = (az, el) => new THREE.Quaternion().setFromRotationMatrix(
  m4.lookAt(new THREE.Vector3(Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el)), ORIGIN, ZUP));
let vc = { t0: 0, tau0: 0, a: 1, b: 1 };
const tauAt = t => { const x = Math.max(0, (t - vc.t0) / RAMP), y = Math.min(x, 1);
  return vc.tau0 + RAMP * (vc.a * y + (vc.b - vc.a) * EI(y) + vc.b * (x - y)); };
const rateTo = (t, b, a = vc.a + (vc.b - vc.a) * ease((t - vc.t0) / RAMP)) => { vc = { t0: t, tau0: tauAt(t), a, b }; };
let seed = 0x811C9DC5;                                 // the solid's own tumble: a seed from its name (FNV-1a)
for (const ch of D.name) seed = Math.imul(seed ^ ch.codePointAt(0), 0x01000193);
const tumble = tumbler(seed, new THREE.Quaternion(), 3600);   // an hour stepped through: #at= up to an hour
let wheel = 1, dSet = 0, spin = true, free = false;
function clipAt() { const d = dSet = camera.position.distanceTo(controls.target); camera.near = 0.01 * d; camera.far = d + 40 * r0; camera.updateProjectionMatrix(); }
// paused, resumed (from the view held by hand, if any: the tumble goes on from there, taken in that view)
function setSpin(on) {
  const t = clock(); spin = on; $('spin').textContent = on ? 'pause rotation' : 'resume rotation';
  if (!on) rateTo(t, 0);
  else if (free) { free = false; rateTo(t, 1, 0); }
  else rateTo(t, 1);
}
function byHand() { if (free) return; const t = clock(); free = true; rateTo(t, 0, 0); spin = false; $('spin').textContent = 'resume rotation'; }
// the camera on its line of sight through the centre, at the framing's distance over the wheel's zoom
function place() {
  controls.target.set(0, 0, 0);
  camera.position.set(0, 0, 0).addScaledVector(new THREE.Vector3(0, 0, 1).applyQuaternion(camera.quaternion), homeDist / wheel);
  clipAt(); camera.updateMatrixWorld(true);
}
camera.quaternion.copy(orient(AZ0, ELEV));
let gdrag = null;
canvas.addEventListener('pointerdown', e => { gdrag = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointermove', e => { if (gdrag && Math.hypot(e.clientX - gdrag.x, e.clientY - gdrag.y) >= 4) { gdrag = null; byHand(); } });
for (const ev of ['pointerup', 'pointercancel']) canvas.addEventListener(ev, () => { gdrag = null; });
$('spin').addEventListener('click', () => setSpin(!spin));

function tick() {
  const t = clock();
  const dNow = camera.position.distanceTo(controls.target);
  if (dNow !== dSet) { wheel *= dSet / dNow; dSet = dNow; }
  place();
  mesh.quaternion.copy(tumble.at(tauAt(t), camera.quaternion));
  redraw3d();
  requestAnimationFrame(tick);
}
function resize() {
  const p = canvas.parentElement;
  if (!p.clientWidth || !p.clientHeight) return;
  renderer.setSize(p.clientWidth, p.clientHeight, false);
  fitFrustum();
}
resize();
if (hs.get('spin') === '0') { vc = { t0: clock(), tau0: clock(), a: 0, b: 0 }; spin = false; $('spin').textContent = 'resume rotation'; }
new ResizeObserver(resize).observe(document.querySelector('main'));
requestAnimationFrame(tick);

</script>
</body>
