<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hendecagonal Trapezohedron passage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;     /* dark scrollbars and controls */
  --bg: #000000;
  --plug: #0080ff;
  --ink: #ececec;
  --ink-2: #8f8f8f;
  --ink-3: #5a5a5a;
  --rule: #242424;
  --track: #3a3a3a;
  --btn: rgba(26, 28, 32, 0.88);   /* a button's fill: a dark grey, translucent over the 3D view */
  --btn-hover: rgba(44, 47, 54, 0.95);
  --btn-rule: #34373d;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); }
body { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }   /* above the buttons' display: inline-flex */
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* the header: a round back button, the name, nu, the algebraic definition's buttons */
header { position: relative; display: flex; align-items: center; gap: 10px 16px; padding: 12px 18px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
header h1 { margin: 0; font-size: 17px; font-weight: 600; }
header .nu { font-family: var(--mono); font-size: 13px; }
#algbtn .short { display: none; }
header .grow { flex: 1; }
/* buttons: pills with a soft fill; the back button and the rotation button carry an icon */
.ghost, .back { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px;
  background: var(--btn); border: 1px solid var(--btn-rule); color: var(--ink); font-size: 14px; font-weight: 500;
  line-height: 1; text-decoration: none; cursor: pointer; white-space: nowrap; transition: background-color 120ms ease, border-color 120ms ease; }
.ghost:hover, .back:hover, .back:focus-visible { background: var(--btn-hover); border-color: var(--ink-3); }
.back { padding: 0 18px 0 12px; }
.back svg, .ghost svg { width: 18px; height: 18px; flex: none; }
#spin { padding-left: 14px; }
#spin .play { display: none; } #spin.paused .play { display: block; } #spin.paused .pause { display: none; }

main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.pane { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.pane + .pane { border-left: 1px solid var(--rule); }
#gl { display: block; width: 100%; height: 100%; touch-action: none; }
#flat { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#flat.dragging { cursor: grabbing; }
.corner { position: absolute; font-size: 12px; }
.ghost.corner { font-size: 14px; }
.tl { left: 14px; top: 14px; } .bl { left: 14px; bottom: 12px; }
.caption { color: var(--ink-2); pointer-events: none; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bl.tools { display: flex; gap: 8px; }

/* the scale slider: from 1 (left) to nu (right), its value at the right; a thick rounded track, a large handle */
footer { display: flex; align-items: center; gap: 28px; padding: 14px 18px 16px; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.ctl { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 14px; }
.ctl .end { font-family: var(--mono); color: var(--ink-2); font-size: 14px; }
.ctl output { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; min-width: 12ch; flex: none; text-align: right; white-space: nowrap; }
.ctl.scale { flex: 2 1 360px; }
.ctl.small { flex: 1 1 200px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: none; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--track); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); margin-top: -8px; border: 0; box-shadow: 0 0 0 4px rgba(0, 128, 255, 0.25); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); border: 0; box-shadow: 0 0 0 4px rgba(0, 128, 255, 0.25); }
input[type=range]:focus-visible { outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--plug); }
input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px var(--plug); }
.scale input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(90deg, var(--track), var(--plug)); }
.scale input[type=range]::-moz-range-track { background: linear-gradient(90deg, var(--track), var(--plug)); }

/* the pose under the header: each matrix with its name at its left */
/* R1, R2 and t side by side, each block on a new line when it does not fit: never a sideways scroll */
.posebar { padding: 8px 18px 9px; border-bottom: 1px solid var(--rule); }
.posenums { display: flex; flex-wrap: wrap; gap: 6px 32px; }
.posenums > div { display: grid; grid-template-columns: auto auto; column-gap: 10px; align-items: start; justify-items: start; }
.posenums h2 { margin: 0; font-size: 12px; font-weight: 500; color: var(--ink-2); line-height: 1.45; }
.posenums table { font-family: var(--mono); font-size: 12px; line-height: 1.45; font-variant-numeric: tabular-nums; border-collapse: collapse; }
.posenums td { box-sizing: content-box; padding: 0 0 0 10px; width: 13ch; text-align: right; white-space: nowrap; }  /* -1.0000000000: the columns align */
.posenums td:first-child { padding-left: 0; }
.posenums .row { display: none; }
.tr { right: 14px; top: 12px; }

/* the algebraic definition: in place of the pose, the views and the slider. The text as it is, never wrapped
   for the page's width (one line per variable, polynomial and range): the panel scrolls both ways */
/* one block per line of the text, a long line wrapping with its continuation indented (Copy and Download give the text
   unwrapped): no sideways scroll */
.alg { display: none; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 14px 18px 28px; }
#algtext { font: 12px/1.55 var(--mono); color: var(--ink); margin: 0; }
#algtext > span { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
#algtext > span.long { padding-left: 4ch; text-indent: -4ch; }
body:not(.algopen) .algonly { display: none; }
body.algopen { grid-template-rows: auto 1fr; }
body.algopen .posebar, body.algopen main, body.algopen footer { display: none; }
body.algopen .alg { display: block; }
#algbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* a Nopert's page (nopert.js): the solid alone, turning; no pose, no projection, no scale */
header .kind { color: var(--ink-2); }
body:not(.nopert) .kind { display: none; }
body.nopert { grid-template-rows: auto 1fr; }
body.nopert .posebar, body.nopert .flatpane, body.nopert footer { display: none; }
body.nopert main { grid-template-columns: 1fr; }

/* phones: no page scroll (a drag in the view moves it); nu under the title, the pose under it, the slider at the bottom */
@media (max-width: 760px) {
  body { position: fixed; inset: 0; height: auto; }
  header { gap: 6px 12px; padding: 10px 14px 8px; }
  header h1 { font-size: 16px; }
  header .nu { order: 3; flex-basis: 100%; font-size: 12px; overflow-wrap: anywhere; }
  .back { width: 40px; padding: 0; justify-content: center; } .back span { display: none; }   /* the arrow alone */
  /* one row: the arrow, the name (wrapping when long), the definition's button with a short label */
  header h1 { flex: 1 1 0; min-width: 0; line-height: 1.25; }
  header .grow { display: none; }
  #algbtn { padding: 0 14px; } #algbtn .long { display: none; } #algbtn .short { display: inline; }
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .pane + .pane { border-left: 0; border-top: 1px solid var(--rule); }
  .tl { left: 10px; top: 8px; } .tr { right: 10px; top: 8px; }
  footer { flex-direction: column; align-items: stretch; gap: 8px; padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); }
  .ctl.scale { flex: none; }
  /* the pose as rows, t as a row */
  .posebar { padding: 6px 14px 7px; }
  .posenums { flex-direction: column; gap: 3px; }
  .posenums > div { grid-template-columns: 2em auto; column-gap: 0; }
  .posenums h2, .posenums table { font-size: 11px; }
  .posenums .col { display: none; } .posenums .row { display: grid; }
  .alg { padding: 10px 14px calc(20px + env(safe-area-inset-bottom)); }
  #algtext { font-size: 11px; }
}
@media (max-width: 360px) { .posenums h2, .posenums table { font-size: 10px; } }
/* phones, upright or turned: the 3D view only (the projection is drawn in it too); the same query in explorer.js */
@media (max-width: 760px), (pointer: coarse) and (max-height: 520px) {
  .flatpane { display: none; }
  main { grid-template-columns: 1fr; grid-template-rows: 1fr; }
}
@media (max-height: 520px) and (min-width: 761px) {
  header { padding: 6px 18px 5px; } .posebar { padding: 4px 18px 5px; } footer { padding: 6px 18px 8px; gap: 18px; }
  .ghost, .back { height: 34px; }
}
@media (pointer: coarse) {
  input[type=range] { height: 40px; }
  input[type=range]::-webkit-slider-thumb { width: 28px; height: 28px; margin-top: -11px; }
  input[type=range]::-moz-range-thumb { width: 28px; height: 28px; }
}
</style>

  const H = Math.max(2 * focusBox(c).half, 2.5 * (zh - zl)), lo = zl - Math.max(...zs) - 0.6 * H, hi = zh - Math.min(...zs) + 0.6 * H;
  const j = hull.findIndex(i => c.vs.includes(i));
  let amid, A;
  if (j >= 0) {
    const away = i => Math.atan2(p[1] - P2[i][1], p[0] - P2[i][0]), a1 = away(hull[(j + n - 1) % n]), a2 = away(hull[(j + 1) % n]);
    A = wrap(a2 - a1) / 2; amid = a1 + A;
  } else {      // inside an outline edge (no outline vertex there): from along it one way to along it the other
    let best = 0, bd = Infinity;
    for (let e = 0; e < n; e++) { const a = P2[hull[e]], b = P2[hull[(e + 1) % n]], d = segDist(p, a, b); if (d < bd) { bd = d; best = e; } }
    const a = P2[hull[best]], b = P2[hull[(best + 1) % n]];
    amid = Math.atan2(-(b[0] - a[0]), b[1] - a[1]); A = Math.PI / 2;      // the outward normal of a counter-clockwise outline
  }
  return { target: [p[0], p[1], (zl + zh) / 2], H, mid: (lo + hi) / 2, amp: (hi - lo) / 2, amid, A };
}

// ---------- 2D ----------
const svg = document.getElementById('flat');
const view = { ox: 0, oy: 0, z: 1 };
function fitView() {          // the hole's centre (the origin) in the middle, the largest zoom with margins of at least 5%
  const W = svg.clientWidth, Ht = svg.clientHeight;
  return { z: 0.45 * Math.min(W / Math.max(...H2.map(p => Math.abs(p[0]))), Ht / Math.max(...H2.map(p => Math.abs(p[1])))), ox: 0, oy: 0 };
}
const X = x => svg.clientWidth / 2 + (x - view.ox) * view.z, Y = y => svg.clientHeight / 2 - (y - view.oy) * view.z;
// phones: no 2D view (the template hides it under the same query); its state still follows, for a turn to a wider screen
const no2d = matchMedia('(max-width: 760px), (pointer: coarse) and (max-height: 520px)');
function draw2d() {
  if (no2d.matches) return;
  const out = [`<rect width="100%" height="100%" fill="#000000"/>`];
  const d = pts => 'M' + pts.map(p => `${X(p.x).toFixed(2)},${Y(p.y).toFixed(2)}`).join('L') + 'Z';
  const seg = ([a, b]) => `<line x1="${X(a.x).toFixed(2)}" y1="${Y(a.y).toFixed(2)}" x2="${X(b.x).toFixed(2)}" y2="${Y(b.y).toFixed(2)}"/>`;
  for (const it of stat.flat) {
    // a wireframe: the faces are black (on the black ground they only dim the edges behind them, by 1 - opacity)
    if (it.loops) out.push(`<path d="${it.loops.map(d).join('')}" fill="#000000" fill-opacity="${it.c[3]}" fill-rule="evenodd"/>`);
    else out.push(`<g stroke="${css(it.c)}" stroke-width="${it.w}" ${it.dash ? `stroke-dasharray="${DASH.join(' ')}" stroke-linecap="butt"`
      : 'stroke-linecap="round"'} opacity="${it.c[3]}">${it.segs.map(seg).join('')}</g>`);
  }
  svg.innerHTML = out.join('');
}
let anim2 = null;            // the 2D view easing to a new frame, with the same timing as the 3D
const goto2d = to => { anim2 = { from: { ...view }, to, ts: clock() }; };
function step2d(t) {
  if (!anim2) return;
  if (no2d.matches) { Object.assign(view, anim2.to); anim2 = null; return; }
  const u = ease((t - anim2.ts) / BLEND), a = anim2.from, b = anim2.to;
  const p = zoomPath([a.ox, a.oy], a.z, [b.ox, b.oy], b.z, u); view.ox = p.c[0]; view.oy = p.c[1]; view.z = p.z;
  draw2d(); if (u >= 1) anim2 = null;
}

// ---------- the contacts: hover marks the one a click would take; a click focuses it, or goes home ----------
let focus = null, plan = null, hover = null;
function focusBox(c) {     // the distance at l = 1 and at nu (between them it sweeps their hull), with room around it
  const pts = [...connector(c, plug2(1)), ...connector(c, plug2(D.nu))], xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const ext = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
  return { cx: (Math.max(...xs) + Math.min(...xs)) / 2, cy: (Math.max(...ys) + Math.min(...ys)) / 2, half: 2.5 * ext };
}
const focusView = k => { const b = focusBox(contacts[k]); return { ox: b.cx, oy: b.cy, z: Math.min(svg.clientWidth, svg.clientHeight) / (2 * b.half) }; };
function segDist(m, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
  const u = L2 ? Math.max(0, Math.min(1, ((m[0] - a[0]) * dx + (m[1] - a[1]) * dy) / L2)) : 0;
  return Math.hypot(m[0] - a[0] - u * dx, m[1] - a[1] - u * dy); }
// px: the pointer is at a contact when one of its current lines passes this close (a finger: farther)
const reach = e => e.pointerType === 'mouse' ? 12 : 24;
function nearest(m, segsOf, near) {
  let best = null, bd = near;
  contacts.forEach((c, k) => { for (const [a, b] of segsOf(c, k)) { const d = segDist(m, a, b); if (d <= bd) { bd = d; best = k; } } });
  return best;
}
const flatSegs = c => [connector(c, stat.P2).map(p => [X(p[0]), Y(p[1])])];
const glSegs = (c, k) => { const toPx = q => { const s = new THREE.Vector3(q.x, q.y, q.z).project(camera); return [(s.x + 1) / 2 * canvas.clientWidth, (1 - s.y) / 2 * canvas.clientHeight]; };
  return mov && mov.picks[k] ? mov.picks[k].map(([a, b]) => [toPx(a), toPx(b)]) : []; };
function setHover(k) { if (k === hover) return; hover = k; svg.style.cursor = canvas.style.cursor = k === null ? '' : 'pointer'; restat(); }
function choose(k) {           // a click at contact k (or none)
  const t = clock();
  if (k !== null && k !== focus) { focus = k; plan = makePlan(k); glide(focusMotion(plan), t); goto2d(focusView(k)); }
  else if (focus !== null) { focus = null; plan = null; glide(homeMotion(), t); goto2d(fitView()); }
}
const local = (el, e) => { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
const wheelK = e => Math.exp(-0.002 * e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 800 : 1));
// 2D: a click or tap picks, a drag pans, two fingers zoom about their midpoint (and pan with it)
const downs = new Map();
let drag = null, pinch = null;
const toWorld = m => [view.ox + (m[0] - svg.clientWidth / 2) / view.z, view.oy - (m[1] - svg.clientHeight / 2) / view.z];
const two = () => { const [a, b] = [...downs.values()], r = svg.getBoundingClientRect();
  return { d: Math.max(1, Math.hypot(a[0] - b[0], a[1] - b[1])), m: [(a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top] }; };
const panFrom = (x, y) => ({ moved: true, x, y, ox: view.ox, oy: view.oy });
svg.addEventListener('pointerdown', e => {
  downs.set(e.pointerId, [e.clientX, e.clientY]); svg.setPointerCapture(e.pointerId);
  if (downs.size === 1) drag = { x: e.clientX, y: e.clientY, moved: false };
  else if (downs.size === 2) { const p = two(); pinch = { d: p.d, z: view.z, w: toWorld(p.m) }; drag = null; anim2 = null; setHover(null); } });
svg.addEventListener('pointermove', e => {
  if (downs.has(e.pointerId)) downs.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && downs.size >= 2) { const p = two(); view.z = pinch.z * p.d / pinch.d;
    view.ox = pinch.w[0] - (p.m[0] - svg.clientWidth / 2) / view.z; view.oy = pinch.w[1] + (p.m[1] - svg.clientHeight / 2) / view.z; draw2d(); return; }
  if (!drag) { if (!downs.size && e.pointerType === 'mouse') setHover(nearest(local(svg, e), flatSegs, reach(e))); return; }
  if (!drag.moved) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 4) return;
    drag = panFrom(e.clientX, e.clientY); anim2 = null; setHover(null); svg.classList.add('dragging'); }
  view.ox = drag.ox - (e.clientX - drag.x) / view.z; view.oy = drag.oy + (e.clientY - drag.y) / view.z; draw2d(); });
const lift = e => { downs.delete(e.pointerId);
  if (downs.size === 1 && pinch) { const [p] = [...downs.values()]; drag = panFrom(p[0], p[1]); }   // the finger left pans on
  if (downs.size < 2) pinch = null;
  if (!downs.size) { drag = null; svg.classList.remove('dragging'); } };
svg.addEventListener('pointerup', e => { if (drag && !drag.moved && downs.size === 1) choose(nearest(local(svg, e), flatSegs, reach(e))); lift(e); });
svg.addEventListener('pointercancel', lift);
svg.addEventListener('pointerleave', e => { if (!downs.size && e.pointerType === 'mouse') setHover(null); });
svg.addEventListener('wheel', e => { e.preventDefault(); anim2 = null; const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const wx = view.ox + (mx - r.width / 2) / view.z, wy = view.oy - (my - r.height / 2) / view.z;
  view.z *= wheelK(e); view.ox = wx - (mx - r.width / 2) / view.z; view.oy = wy + (my - r.height / 2) / view.z; draw2d(); }, { passive: false });
// 3D: a click or tap picks, a drag (one finger) turns the view by hand, two fingers zoom (the orbit controls)
const gdowns = new Set();
let gdrag = null;
canvas.addEventListener('pointerdown', e => { gdowns.add(e.pointerId);
  gdrag = gdowns.size === 1 ? { x: e.clientX, y: e.clientY, moved: false } : { moved: true, zoom: true }; });
canvas.addEventListener('pointermove', e => {
  if (!gdrag) { if (e.pointerType === 'mouse') setHover(nearest(local(canvas, e), glSegs, reach(e))); return; }
  if (!gdrag.moved && Math.hypot(e.clientX - gdrag.x, e.clientY - gdrag.y) >= 4) { gdrag.moved = true; setHover(null); byHand(); } });
const glift = e => { gdowns.delete(e.pointerId); if (!gdowns.size) gdrag = null; };
canvas.addEventListener('pointerup', e => { if (gdrag && !gdrag.moved) choose(nearest(local(canvas, e), glSegs, reach(e))); glift(e); });
canvas.addEventListener('pointercancel', glift);
canvas.addEventListener('pointerleave', e => { if (!gdrag && e.pointerType === 'mouse') setHover(null); });

// ---------- controls ----------
const $ = id => document.getElementById(id);
$('nutext').textContent = D.nu_text;
// the rotation button: its text and its icon (pause while turning, play while still)
function spinLabel(on) { const b = document.getElementById('spin'), s = document.getElementById('spintext');
  (s || b).textContent = on ? 'Pause rotation' : 'Resume rotation'; b.classList.toggle('paused', !on); }
// the scale to ten decimals cut, never rounded, so no value shown is above nu: at the top the header's decimals of nu
// (a lower bound, build.py), below it the double's exact decimal (toFixed(60) is exact for a double >= 1) cut; the
// top itself, D.nu, is the largest double not above that lower bound
const cut10 = s => s.slice(0, s.indexOf('.') + 11);
const setScale = () => { const v = +$('scale').value / 1000; S.l = v >= 1 ? D.nu : 1 + v * (D.nu - 1); $('scaleout').textContent = cut10(S.l === D.nu ? D.nu_text : S.l.toFixed(60)); };
const restat = () => { rebuildStatic(); if (focus !== null) Object.assign(plan, makePlan(focus)); draw2d(); };   // (no gap label: Bence 2026-11-20)
$('scale').addEventListener('input', () => { setScale(); restat(); });
$('spin').addEventListener('click', () => setSpin(!spin));
// the pose to ten decimals (each number's full double on hover); t a column beside the matrices, a row on phones
const mat = (name, Mx, cls = '') => `<div class="${cls}"><h2>${name}</h2><table>${Mx.map(r => `<tr>${r.map(a => `<td title="${a}">${(Math.abs(a) < 1e-15 ? 0 : a).toFixed(10)}</td>`).join('')}</tr>`).join('')}</table></div>`;
$('posenums').innerHTML = mat('R₁', D.R1) + mat('R₂', D.R2) + mat('t', D.t.map(a => [a]), 'col') + mat('t', [D.t], 'row');

// ---------- the algebraic definition (algebraic_text.py's text, in the data when the solid has one) ----------
// in place of the pose, the views and the slider; shown as it is, never wrapped (the panel scrolls sideways),
// with Copy and Download (the file named after the solid)
const algIsOpen = () => document.body.classList.contains('algopen');
const algOpen = o => {
  if (o && !$('algtext').firstChild) {         // one block per line, so a long line wraps with an indent (template.html)
    // the prose is broken at 100 columns already; a longer line (a polynomial, a range) wraps with its continuation indented
    for (const line of D.algebraic.split('\n')) { const s = document.createElement('span'); s.textContent = line || ' '; if (line.length > 100) s.className = 'long'; $('algtext').append(s); }
  }
  document.body.classList.toggle('algopen', o); $('algbtn').setAttribute('aria-pressed', o);
  $('algbtn').innerHTML = o ? 'Back to the plot' : '<span class="long">Algebraic definition</span><span class="short">Definition</span>';
};
const flash = (b, text) => { const was = b.dataset.label ??= b.textContent; b.textContent = text; setTimeout(() => { b.textContent = was; }, 1600); };
let downloads = null;                                   // claude.ai's save prompt, when the page runs there
if (window.claude?.use) window.claude.use('downloads').then(d => { downloads = d; }, () => {});
async function algCopy() {
  try { await navigator.clipboard.writeText(D.algebraic); flash($('algcopy'), 'Copied'); return; } catch (e) { /* below */ }
  const r = document.createRange(); r.selectNodeContents($('algtext'));    // a frame without the clipboard: select it
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* stays selected */ }
  flash($('algcopy'), ok ? 'Copied' : 'Selected: press Ctrl+C');
}
async function algSave() {
  const filename = `${D.solid.split('/').pop()}.txt`;
  if (downloads) {
    try { await downloads.save({ filename, data: D.algebraic }); flash($('algsave'), 'Saved'); return; }
    catch (e) { if (e?.code === 'declined') return; if (e?.code === 'rate_limited') { flash($('algsave'), 'Busy: try again'); return; } }
  }
  const url = URL.createObjectURL(new Blob([D.algebraic], { type: 'text/plain' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
if (D.algebraic) {
  $('algbtn').hidden = false;
  $('algbtn').addEventListener('click', () => algOpen(!algIsOpen()));
  $('algcopy').addEventListener('click', algCopy);
  $('algsave').addEventListener('click', algSave);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && algIsOpen()) algOpen(false); });
}

function tick() {
  const t = clock();
  const dNow = camera.position.distanceTo(controls.target);       // the controls' dolly (wheel, pinch): on top of the motion's
  if (dNow !== dSet) { wheel *= dSet / dNow; dSet = dNow; }
  if (next && t >= nextAt) { pose = next; next = null; }
  if (free) { S.off = motion.off(t); clipAt(); camera.updateMatrixWorld(true); } else place(pose(t));
  if (!algIsOpen()) { redraw3d(); step2d(t); }      // nothing to draw under the algebraic definition
  requestAnimationFrame(tick);
}
function resize() {
  const p = canvas.parentElement;
  if (!p.clientWidth || !p.clientHeight) return;      // hidden (the algebraic definition): sized again when shown
  renderer.setSize(p.clientWidth, p.clientHeight, false);
  fitFrustum(); svg.setAttribute('width', svg.clientWidth); svg.setAttribute('height', svg.clientHeight);
  anim2 = null; Object.assign(view, focus === null ? fitView() : focusView(focus)); draw2d();
}
// a state in the address, e.g. #scale=400&focus=2&spin=0&at=30 (at: the clock, in s)
if (hs.has('scale')) $('scale').value = hs.get('scale');
setScale(); rebuildStatic(); resize();
if (hs.has('focus')) { focus = +hs.get('focus'); plan = makePlan(focus); motion = focusMotion(plan); pose = live(motion); Object.assign(view, focusView(focus)); draw2d(); }
if (hs.get('alg') === '1' && D.algebraic) algOpen(true);
if (hs.get('spin') === '0') { vc = { t0: clock(), tau0: clock(), a: 0, b: 0 }; spin = false; spinLabel(false); }
new ResizeObserver(resize).observe(document.querySelector('main'));
no2d.addEventListener('change', resize);
requestAnimationFrame(tick);

</script>
</body>
