<style>
:root {
  color-scheme: dark;     /* dark scrollbars and controls */
  --bg: #000000;
  --plug: #0080ff;
  --ink: #ececec;
  --ink-2: #8f8f8f;
  --ink-3: #5a5a5a;
  --rule: #242424;
  --track: #3a3a3a;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); }
body { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

header { position: relative; display: flex; align-items: baseline; gap: 18px; padding: 12px 18px 10px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
header h1 { margin: 0; font-size: 15px; font-weight: 600; }
.back { color: var(--ink-2); text-decoration: none; font-size: 15px; line-height: 1; }
.back:hover, .back:focus-visible { color: var(--ink); }
header .nu { font-family: var(--mono); }
header .grow { flex: 1; }
.ghost { background: none; border: 1px solid var(--rule); border-radius: 3px; padding: 3px 10px; color: var(--ink); cursor: pointer; }
.ghost:hover { border-color: var(--ink-3); }
#spin { background: #000000; }

main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.pane { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.pane + .pane { border-left: 1px solid var(--rule); }
#gl { display: block; width: 100%; height: 100%; touch-action: none; }
#flat { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#flat.dragging { cursor: grabbing; }
.corner { position: absolute; font-size: 12px; }
.tl { left: 14px; top: 12px; } .bl { left: 14px; bottom: 12px; }
.caption { color: var(--ink-2); pointer-events: none; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bl.tools { display: flex; gap: 8px; }

footer { display: flex; align-items: center; gap: 28px; padding: 12px 18px 14px; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.ctl { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 10px; row-gap: 2px; }
.ctl .lab { grid-column: 1 / -1; color: var(--ink-2); }
.ctl .end { font-family: var(--mono); color: var(--ink-3); font-size: 12px; }
.ctl output { font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 12ch; flex: none; text-align: right; white-space: nowrap; }
.ctl.scale { flex: 2 1 360px; }
.ctl.small { flex: 1 1 200px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: none; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--track); }
input[type=range]::-moz-range-track { height: 2px; background: var(--track); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); margin-top: -5px; border: 0; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 0; }
.scale input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(90deg, var(--track), var(--plug)); }
.scale input[type=range]::-moz-range-track { background: linear-gradient(90deg, var(--track), var(--plug)); }

.posebar { padding: 8px 18px 9px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.posenums { display: flex; gap: 32px; }
.posenums > div { display: grid; grid-template-columns: auto auto; column-gap: 10px; align-items: start; justify-items: start; }
.posenums h2 { margin: 0; font-size: 12px; font-weight: 500; color: var(--ink-2); line-height: 1.45; }
.posenums table { font-family: var(--mono); font-size: 12px; line-height: 1.45; font-variant-numeric: tabular-nums; border-collapse: collapse; }

.posenums td:first-child { padding-left: 0; }
.posenums .row { display: none; }
.tr { right: 14px; top: 12px; }

/* the algebraic definition: in place of the pose, the views and the slider. The text as it is, never wrapped

.alg { display: none; min-height: 0; overflow: auto; padding: 14px 18px 28px; }
#algtext { font: 12px/1.55 var(--mono); color: var(--ink); white-space: pre; width: max-content; margin: 0; }
body:not(.algopen) .algonly { display: none; }
body.algopen { grid-template-rows: auto 1fr; }
body.algopen .posebar, body.algopen main, body.algopen footer { display: none; }
body.algopen .alg { display: block; }
#algbtn[aria-pressed="true"] { border-color: var(--ink-3); }

/* a Nopert's page (nopert.js): the solid alone, turning; no pose, no projection, no scale */
header .kind { color: var(--ink-2); }
body:not(.nopert) .kind { display: none; }
body.nopert { grid-template-rows: auto 1fr; }
body.nopert .posebar, body.nopert .flatpane, body.nopert footer { display: none; }
body.nopert main { grid-template-columns: 1fr; }

/* phones: no page scroll (a drag in the view moves it); nu under the title, the pose under it, the slider at the bottom */
@media (max-width: 760px) {
  body { position: fixed; inset: 0; height: auto; }
  header { gap: 2px 12px; padding: 10px 14px 8px; }
  header .nu { order: 3; flex-basis: 100%; font-size: 12px; overflow-wrap: anywhere; }
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .pane + .pane { border-left: 0; border-top: 1px solid var(--rule); }
  .tl { left: 10px; top: 8px; } .tr { right: 10px; top: 8px; }
  footer { flex-direction: column; align-items: stretch; gap: 8px; padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); }
  .ctl.scale { flex: none; grid-template-columns: auto auto 1fr auto; }
  .ctl .lab { grid-column: auto; }
  /* the pose as rows, t as a row */
  .posebar { padding: 6px 14px 7px; }
  .posenums { flex-direction: column; gap: 3px; }
  .posenums > div { grid-template-columns: 2em auto; column-gap: 0; }
  .posenums h2, .posenums table { font-size: 11px; }
  .posenums .col { display: none; } .posenums .row { display: grid; }
  .alg { padding: 10px 14px calc(20px + env(safe-area-inset-bottom)); }
  #algtext { font-size: 11px; }
}
/* phones, upright or turned: the 3D view only (the projection is drawn in it too); the same query in explorer.js */
@media (max-width: 760px), (pointer: coarse) and (max-height: 520px) {
  .flatpane { display: none; }
  main { grid-template-columns: 1fr; grid-template-rows: 1fr; }
}
@media (max-height: 520px) and (min-width: 761px) {
  header { padding: 6px 18px 5px; } .posebar { padding: 4px 18px 5px; } footer { padding: 6px 18px 8px; gap: 18px; } .ctl .lab { display: none; }
}
@media (pointer: coarse) {
  input[type=range] { height: 30px; }
  input[type=range]::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -10px; }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; }
  .ghost { padding: 6px 12px; }
}

const mat = (name, Mx, cls = '') => `<div class="${cls}"><h2>${name}</h2><table>${Mx.map(r => `<tr>${r.map(a => `<td title="${a}">${(Math.abs(a) < 1e-15 ? 0 : a).toFixed(10)}</td>`).join('')}</tr>`).join('')}</table></div>`;
$('posenums').innerHTML = mat('R₁', D.R1) + mat('R₂', D.R2) + mat('t', D.t.map(a => [a]), 'col') + mat('t', [D.t], 'row');

// ---------- the algebraic definition (algebraic_text.py's text, in the data when the solid has one) ----------
// in place of the pose, the views and the slider; shown as it is, never wrapped (the panel scrolls sideways),
// with Copy and Download (the file named after the solid)
const algIsOpen = () => document.body.classList.contains('algopen');
const algOpen = o => {
  if (o && !$('algtext').textContent) $('algtext').textContent = D.algebraic;
  document.body.classList.toggle('algopen', o); $('algbtn').setAttribute('aria-pressed', o);
  $('algbtn').textContent = o ? 'Back to the plot' : 'Algebraic definition';
};
const flash = (b, text) => { const was = b.dataset.label ??= b.textContent; b.textContent = text; setTimeout(() => { b.textContent = was; }, 1600); };
let downloads = null;                                   // claude.ai's save prompt, when the page runs there
if (window.claude?.use) window.claude.use('downloads').then(d => { downloads = d; }, () => {});
async function algCopy() {
  try { await navigator.clipboard.writeText(D.algebraic); flash($('algcopy'), 'Copied'); return; } catch (e) { /* below */ }
  const r = document.createRange(); r.selectNodeContents($('algtext'));    // a frame without the clipboard: select it
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* stays selected */ }
  flash($('algcopy'), ok ? 'Copied' : 'Selected: press Ctrl+C');
}
async function algSave() {
  const filename = `${D.solid.split('/').pop()}.txt`;
  if (downloads) {
    try { await downloads.save({ filename, data: D.algebraic }); flash($('algsave'), 'Saved'); return; }
    catch (e) { if (e?.code === 'declined') return; if (e?.code === 'rate_limited') { flash($('algsave'), 'Busy: try again'); return; } }
  }
  const url = URL.createObjectURL(new Blob([D.algebraic], { type: 'text/plain' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
if (D.algebraic) {
  $('algbtn').hidden = false;
  $('algbtn').addEventListener('click', () => algOpen(!algIsOpen()));
  $('algcopy').addEventListener('click', algCopy);
  $('algsave').addEventListener('click', algSave);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && algIsOpen()) algOpen(false); });
}

function tick() {
  const t = clock();
  const dNow = camera.position.distanceTo(controls.target);       // the controls' dolly (wheel, pinch): on top of the motion's
  if (dNow !== dSet) { wheel *= dSet / dNow; dSet = dNow; }
  if (next && t >= nextAt) { pose = next; next = null; }
  if (free) { S.off = motion.off(t); clipAt(); camera.updateMatrixWorld(true); } else place(pose(t));
  if (!algIsOpen()) { redraw3d(); step2d(t); }      // nothing to draw under the algebraic definition
  requestAnimationFrame(tick);
}
function resize() {
  const p = canvas.parentElement;
  if (!p.clientWidth || !p.clientHeight) return;      // hidden (the algebraic definition): sized again when shown
  renderer.setSize(p.clientWidth, p.clientHeight, false);
  fitFrustum(); svg.setAttribute('width', svg.clientWidth); svg.setAttribute('height', svg.clientHeight);
  anim2 = null; Object.assign(view, focus === null ? fitView() : focusView(focus)); draw2d();
}
// a state in the address, e.g. #scale=400&focus=2&spin=0&at=30 (at: the clock, in s)
if (hs.has('scale')) $('scale').value = hs.get('scale');
setScale(); rebuildStatic(); showGap(); resize();
if (hs.has('focus')) { focus = +hs.get('focus'); plan = makePlan(focus); motion = focusMotion(plan); pose = live(motion); Object.assign(view, focusView(focus)); draw2d(); }
if (hs.get('alg') === '1' && D.algebraic) algOpen(true);
if (hs.get('spin') === '0') { vc = { t0: clock(), tau0: clock(), a: 0, b: 0 }; spin = false; $('spin').textContent = 'resume rotation'; }
new ResizeObserver(resize).observe(document.querySelector('main'));
no2d.addEventListener('change', resize);
requestAnimationFrame(tick);

</script>
</body>
</html>
